<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-link">
            <img src="/static/Logo.svg" alt="SurveySystem Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SurveySystem</span>
        </a>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/login_page">Вход</a>
            <a href="/register_page">Регистрация</a>
        </div>
    </nav>

    <div style="max-width: 500px; margin: 4rem auto; text-align: center; padding: 2rem;">
        <div class="loading-spinner"></div>
        <h2>Проверка авторизации...</h2>
        <p id="message" style="color: var(--text-secondary);">Пожалуйста, подождите</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const testCode = urlParams.get('code');
        const redirectPath = urlParams.get('path') || 'take_test';
        
        async function checkAuth() {
            if (!testCode) {
                document.getElementById('message').innerHTML = 'Код теста не указан<br><a href="/" class="btn btn-primary" style="margin-top: 1rem;">На главную</a>';
                return;
            }
            
            try {
                const response = await fetch('/check_auth');
                const data = await response.json();
                
                if (data.authenticated) {
                    document.getElementById('message').innerHTML = 'Перенаправление на тест...';
                    setTimeout(() => {
                        window.location.href = `/${redirectPath}?code=${testCode}`;
                    }, 1000);
                } else {
                    document.getElementById('message').innerHTML = 'Требуется авторизация<br>Перенаправление на страницу входа...';
                    setTimeout(() => {
                        window.location.href = `/login_page?redirect=${redirectPath}&code=${testCode}`;
                    }, 1500);
                }
            } catch (error) {
                document.getElementById('message').innerHTML = 'Ошибка соединения<br><a href="/" class="btn btn-primary" style="margin-top: 1rem;">На главную</a>';
            }
        }
        
        checkAuth();
    </script>
</body>
</html>
