<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои результаты - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .result-item {
            background: white;
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .result-item:hover {
            transform: translateX(5px);
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .my-test-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 1rem;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
        }
        .my-test-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-sm);
        }
        .test-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .btn-small {
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
        }
        .my-tests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .results-table-wrapper {
            overflow-x: auto;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }
        .results-stats {
            display: flex;
            gap: 1rem;
            justify-content: space-around;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .stat-mini {
            text-align: center;
            background: var(--primary-soft);
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            min-width: 80px;
        }
        .stat-mini .number {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-mini .label {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-link:hover {
            opacity: 0.8;
        }
        .logo-img {
            height: 40px;
            width: auto;
            display: block;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        /* QR код модальное окно */
        .qr-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .qr-modal-overlay.active {
            display: flex;
        }
        .qr-modal-content {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .qr-modal-content h3 {
            margin-bottom: 0.5rem;
        }
        .qr-modal-content p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .qr-modal-content img {
            max-width: 200px;
            margin: 0.5rem auto;
            display: block;
        }
        .qr-modal-content .code-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-soft);
            padding: 0.5rem;
            border-radius: var(--radius-sm);
            margin: 0.5rem 0;
        }
        .qr-modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .btn-qr {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            background: var(--primary-soft);
            color: var(--primary);
        }
        .btn-qr:hover {
            background: var(--primary-light);
        }
        .btn-qr-primary {
            background: var(--primary);
            color: white;
        }
        .btn-qr-primary:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-link">
            <img src="/static/Logo.svg" alt="SurveySystem Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SurveySystem</span>
        </a>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/student_dashboard" class="active">Мои результаты</a>
            <a href="/take_test">Пройти тест</a>
            <a href="/create_test_page">Создать тест</a>
            <a href="#" onclick="logout()">Выход</a>
        </div>
    </nav>

    <div class="admin-header">
        <h1>Личный кабинет</h1>
        <p>Ваши результаты и созданные тесты</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('results')">Пройденные тесты</button>
        <button class="tab-btn" onclick="switchTab('my-tests')">Мои тесты</button>
    </div>

    <div id="results-tab" class="tab-content active">
        <div class="card">
            <div class="card-header">
                <h2>История тестирований</h2>
            </div>
            <div id="results-container">
                <div style="text-align: center; padding: 2rem;">Загрузка результатов...</div>
            </div>
        </div>
    </div>

    <div id="my-tests-tab" class="tab-content">
        <div class="card">
            <div class="card-header">
                <h2>Созданные мной тесты</h2>
                <a href="/create_test_page" class="btn btn-primary btn-small">Создать тест</a>
            </div>
            <div id="my-tests-container">
                <div style="text-align: center; padding: 2rem;">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для QR кода -->
    <div class="qr-modal-overlay" id="qrModal">
        <div class="qr-modal-content">
            <h3 id="qrTestTitle">Название теста</h3>
            <p>Отсканируйте QR-код, чтобы пройти тест</p>
            <img id="qrImage" src="" alt="QR Code">
            <div class="code-display" id="qrCodeDisplay">Код: ABC123</div>
            <div class="qr-modal-actions">
                <button class="btn-qr btn-qr-primary" onclick="closeQRModal()">Закрыть</button>
                <button class="btn-qr" onclick="copyQRCode()">Копировать код</button>
                <a href="#" id="qrTestLink" class="btn-qr btn-qr-primary" target="_blank">Открыть тест</a>
            </div>
        </div>
    </div>

    <script>
        let currentQRCode = '';

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'my-tests') {
                loadMyTests();
            }
        }

        async function loadResults() {
            try {
                const response = await fetch('/api/my_results');
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    let html = `
                        <div class="stats-banner" style="margin-bottom: 1.5rem; background: var(--primary-soft); border-radius: var(--radius-lg); display: flex; justify-content: space-around; padding: 1rem; flex-wrap: wrap;">
                            <div class="stat-item">
                                <div class="stat-number">${data.stats.total_tests}</div>
                                <div class="stat-label">Пройдено тестов</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.stats.avg_percentage}%</div>
                                <div class="stat-label">Средний результат</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.stats.best_percentage}%</div>
                                <div class="stat-label">Лучший результат</div>
                            </div>
                        </div>
                    `;
                    
                    data.results.forEach(r => {
                        html += `
                            <div class="result-item" onclick="viewResultDetail(${r.id})">
                                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                                    <div>
                                        <strong>${escapeHtml(r.title)}</strong>
                                        <div style="font-size: 0.75rem; color: var(--text-muted);">Код: ${r.unique_code}</div>
                                    </div>
                                    <div style="font-size: 1.2rem; font-weight: 700;">
                                        ${r.score} / ${r.max_score} (${r.percentage}%)
                                    </div>
                                </div>
                                <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem;">
                                    ${new Date(r.completed_at).toLocaleString()}
                                </div>
                                <button class="btn btn-outline btn-small" style="margin-top: 0.75rem;">Детальный разбор</button>
                            </div>
                        `;
                    });
                    document.getElementById('results-container').innerHTML = html;
                } else {
                    document.getElementById('results-container').innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <p>Вы ещё не прошли ни одного теста</p>
                            <a href="/take_test" class="btn btn-primary">Пройти тест</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results-container').innerHTML = '<p>Ошибка загрузки результатов</p>';
            }
        }

        async function loadMyTests() {
            try {
                const response = await fetch('/api/get_my_tests');
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login_page';
                        return;
                    }
                    throw new Error('Ошибка загрузки');
                }
                
                const tests = await response.json();
                
                if (tests.length > 0) {
                    let html = '<div class="my-tests-grid">';
                    for (const test of tests) {
                        html += `
                            <div class="my-test-card">
                                <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 0.5rem;">
                                    <div>
                                        <strong>${escapeHtml(test.title)}</strong>
                                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">
                                            Код: ${test.unique_code} • Попыток: ${test.attempts_count || 0}
                                        </div>
                                    </div>
                                    <div class="test-actions" style="margin-top: 0;">
                                        <a href="/take_test?code=${test.unique_code}" class="btn btn-primary btn-small">Пройти</a>
                                        <a href="/edit_test_page/${test.id}" class="btn btn-secondary btn-small">Редактировать</a>
                                        <button class="btn btn-outline btn-small" onclick="copyCode('${test.unique_code}')">Код</button>
                                        <button class="btn btn-outline btn-small" onclick="showQR('${test.unique_code}', '${escapeHtml(test.title)}')">QR</button>
                                        <button class="btn btn-outline btn-small" onclick="toggleResults(${test.id}, '${escapeHtml(test.title)}')">Результаты</button>
                                    </div>
                                </div>
                                <div id="results-${test.id}" style="display: none;"></div>
                            </div>
                        `;
                    }
                    html += '</div>';
                    document.getElementById('my-tests-container').innerHTML = html;
                } else {
                    document.getElementById('my-tests-container').innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <p>У вас пока нет созданных тестов</p>
                            <a href="/create_test_page" class="btn btn-primary">Создать тест</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('my-tests-container').innerHTML = '<p>Ошибка загрузки</p>';
            }
        }

        // Функция для показа QR кода
        async function showQR(code, title) {
            currentQRCode = code;
            document.getElementById('qrTestTitle').textContent = title || 'Тест';
            document.getElementById('qrCodeDisplay').textContent = 'Код: ' + code;
            
            const testUrl = window.location.origin + '/take_test?code=' + code;
            document.getElementById('qrTestLink').href = testUrl;
            
            // Генерируем QR код через API
            try {
                const response = await fetch('/api/generate_qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await response.json();
                if (data.qr_code) {
                    document.getElementById('qrImage').src = 'data:image/png;base64,' + data.qr_code;
                } else {
                    // Если API нет, используем fallback - ссылку на внешний генератор
                    document.getElementById('qrImage').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(testUrl);
                }
            } catch (error) {
                // Fallback на внешний API
                document.getElementById('qrImage').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(testUrl);
            }
            
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }

        function copyQRCode() {
            if (currentQRCode) {
                navigator.clipboard.writeText(currentQRCode);
                alert('Код "' + currentQRCode + '" скопирован в буфер обмена');
            }
        }

        // Закрытие модального окна по клику вне его
        document.getElementById('qrModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeQRModal();
            }
        });

        async function toggleResults(testId, testTitle) {
            const resultsDiv = document.getElementById(`results-${testId}`);
            
            if (resultsDiv.style.display === 'block') {
                resultsDiv.style.display = 'none';
                return;
            }
            
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = '<div style="font-size: 0.8rem; text-align: center; padding: 1rem;">Загрузка результатов...</div>';
            
            try {
                const response = await fetch(`/api/get_test_results/${testId}`);
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login_page';
                        return;
                    }
                    throw new Error('Ошибка загрузки');
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    resultsDiv.innerHTML = `<div style="font-size: 0.8rem; text-align: center; padding: 1rem; color: var(--error);">${data.error}</div>`;
                    return;
                }
                
                if (data.results.length === 0) {
                    resultsDiv.innerHTML = `<div style="font-size: 0.8rem; text-align: center; padding: 1rem; color: var(--text-muted);">Пока нет результатов по этому тесту</div>`;
                    return;
                }
                
                let statsHtml = `
                    <div class="results-stats">
                        <div class="stat-mini">
                            <div class="number">${data.stats.total_attempts}</div>
                            <div class="label">Всего попыток</div>
                        </div>
                        <div class="stat-mini" style="background: var(--success-light);">
                            <div class="number" style="color: var(--success);">${Math.round(data.stats.avg_score || 0)}%</div>
                            <div class="label">Средний балл</div>
                        </div>
                        <div class="stat-mini" style="background: var(--warning-light);">
                            <div class="number" style="color: var(--warning);">${data.stats.max_score || 0}</div>
                            <div class="label">Макс. балл</div>
                        </div>
                    </div>
                    <div class="results-table-wrapper">
                        <table style="width: 100%; font-size: 0.75rem; border-collapse: collapse;">
                            <thead>
                                <tr style="background: var(--primary-soft);">
                                    <th style="padding: 0.5rem; text-align: left;">ФИО студента</th>
                                    <th style="padding: 0.5rem; text-align: left;">Email</th>
                                    <th style="padding: 0.5rem; text-align: left;">Результат</th>
                                    <th style="padding: 0.5rem; text-align: left;">%</th>
                                    <th style="padding: 0.5rem; text-align: left;">Время</th>
                                    <th style="padding: 0.5rem; text-align: center;">Детали</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                for (const r of data.results) {
                    const percentage = r.percentage || 0;
                    let percentColor = percentage >= 80 ? '#2E7D32' : (percentage >= 60 ? '#F57C00' : '#C62828');
                    let percentBg = percentage >= 80 ? '#E8F5E9' : (percentage >= 60 ? '#FFF3E0' : '#FFEBEE');
                    
                    const completedDate = new Date(r.completed_at);
                    const formattedDate = completedDate.toLocaleString('ru-RU', {
                        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                    
                    statsHtml += `
                        <tr style="border-bottom: 1px solid var(--border-light);">
                            <td style="padding: 0.5rem;"><strong>${escapeHtml(r.full_name || r.username)}</strong></td>
                            <td style="padding: 0.5rem; font-size: 0.7rem;">${escapeHtml(r.email)}</td>
                            <td style="padding: 0.5rem;">${r.score} / ${r.max_score}</td>
                            <td style="padding: 0.5rem;">
                                <span style="background: ${percentBg}; color: ${percentColor}; padding: 0.2rem 0.5rem; border-radius: 20px; font-weight: 700;">${percentage}%</span>
                            </td>
                            <td style="padding: 0.5rem; font-size: 0.7rem;">${formattedDate}</td>
                            <td style="padding: 0.5rem; text-align: center;">
                                <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.65rem;" onclick="viewResultDetail(${r.id})">Детали</button>
                            </td>
                        </tr>
                    `;
                }
                
                statsHtml += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                resultsDiv.innerHTML = statsHtml;
                
            } catch (error) {
                console.error('Error loading results:', error);
                resultsDiv.innerHTML = '<div style="font-size: 0.8rem; text-align: center; padding: 1rem; color: var(--error);">Ошибка загрузки</div>';
            }
        }

        function viewResultDetail(resultId) {
            window.location.href = `/result_detail/${resultId}`;
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code);
            alert('Код "' + code + '" скопирован!');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function logout() {
            await fetch('/logout');
            window.location.href = '/';
        }
        
        async function checkAuthAndLoad() {
            try {
                const response = await fetch('/check_auth');
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = '/login_page';
                    return;
                }
                
                loadResults();
            } catch (error) {
                console.error('Auth check error:', error);
                window.location.href = '/login_page';
            }
        }
        
        checkAuthAndLoad();
    </script>

    <!-- Добавляем API для генерации QR кода -->
    <script>
        // Добавляем API для генерации QR кода, если его нет в app.py
        // Это работает как fallback
        if (typeof fetch !== 'undefined') {
            // Проверяем, есть ли API /api/generate_qr
            fetch('/api/generate_qr', { method: 'HEAD' }).catch(() => {
                // Если API нет, используем внешний генератор
                console.log('Using external QR generator');
            });
        }
    </script>
</body>
</html>
