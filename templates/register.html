<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 2rem auto;
            padding: 2rem 2.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-md);
        }
        
        .auth-container h1 {
            font-size: 1.6rem;
            margin-bottom: 1.25rem;
            text-align: center;
            font-weight: 700;
        }
        
        .auth-container .form-group {
            margin-bottom: 0.9rem;
        }
        
        .auth-container .form-group label {
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .auth-container .form-group input {
            padding: 0.6rem 0.9rem;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
        }
        
        .auth-container .btn {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }
        
        .auth-footer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            font-size: 0.85rem;
        }
        
        .message {
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }
        
        .navbar {
            padding: 0.8rem 2.5rem;
        }
        
        .logo-img {
            height: 38px;
        }
        
        .logo-text {
            font-size: 1.3rem;
        }
        
        .nav-links a {
            padding: 0.45rem 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-link">
            <img src="/static/Logo.svg" alt="SurveySystem Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SurveySystem</span>
        </a>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/login_page">Вход</a>
            <a href="/register_page" class="active">Регистрация</a>
        </div>
    </nav>

    <div class="auth-container">
        <h1>Регистрация</h1>

        <form id="register-form" onsubmit="register(event)">
            <div class="form-group">
                <label for="username">Логин *</label>
                <input type="text" id="username" required placeholder="Придумайте логин">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="full-name">ФИО</label>
                <input type="text" id="full-name" placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" required placeholder="Минимум 6 символов" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm-password">Подтвердите пароль *</label>
                <input type="password" id="confirm-password" required placeholder="Повторите пароль">
            </div>

            <div id="message" class="message"></div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="/login_page">Войти</a></p>
        </div>
    </div>

    <script>
        // Получаем параметры из URL
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                redirect: params.get('redirect'),
                code: params.get('code')
            };
        }

        async function register(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const fullName = document.getElementById('full-name').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            if (!username || !email || !password) {
                msg.className = 'message error';
                msg.textContent = 'Заполните все обязательные поля';
                msg.style.display = 'block';
                return;
            }
            
            if (password !== confirm) {
                msg.className = 'message error';
                msg.textContent = 'Пароли не совпадают';
                msg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                msg.className = 'message error';
                msg.textContent = 'Пароль должен быть минимум 6 символов';
                msg.style.display = 'block';
                return;
            }

            // Определяем URL для перенаправления после регистрации
            const params = getQueryParams();
            let redirectUrl = '/';
            if (params.redirect && params.code) {
                redirectUrl = `/${params.redirect}?code=${params.code}`;
            }

            try {
                const registerResponse = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        full_name: fullName,
                        password: password,
                        role: 'student',
                        redirect_url: redirectUrl  // Передаем URL для перенаправления
                    })
                });

                const registerData = await registerResponse.json();
                
                if (!registerData.success) {
                    msg.className = 'message error';
                    msg.textContent = registerData.error || 'Ошибка регистрации';
                    msg.style.display = 'block';
                    return;
                }

                msg.className = 'message success';
                msg.textContent = 'Регистрация успешна! Перенаправление...';
                msg.style.display = 'block';
                
                // Перенаправляем на нужную страницу
                setTimeout(() => {
                    window.location.href = registerData.redirect_url || '/';
                }, 1000);

            } catch (error) {
                msg.className = 'message error';
                msg.textContent = 'Ошибка подключения к серверу';
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
