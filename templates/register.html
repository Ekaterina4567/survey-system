<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Общие стили как на главной */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FDF8F0;
            color: #3D2B1F;
            line-height: 1.5;
            font-size: 14px;
            min-height: 100vh;
        }

        /* Навигация как на главной */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            padding: 0.8rem 2.5rem;
            border-bottom: 1px solid #EDE3D8;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .logo-link:hover {
            opacity: 0.85;
        }

        .logo-img {
            height: 38px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8B5E3C 0%, #2C5F8A 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: #7A6B5D;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-radius: 10px;
        }

        .nav-links a:hover {
            color: #8B5E3C;
            background: #F5EDE3;
        }

        .nav-links a.active {
            color: #8B5E3C;
            background: #F5EDE3;
            font-weight: 600;
        }

        /* Контейнер регистрации */
        .auth-container {
            max-width: 440px;
            margin: 2.5rem auto;
            padding: 2.5rem;
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid #E8DDD0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .auth-container h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #3D2B1F;
        }

        .auth-container h1 span {
            background: linear-gradient(135deg, #8B5E3C 0%, #2C5F8A 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: #3D2B1F;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #EDE3D8;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: inherit;
            background: #FFFFFF;
            color: #3D2B1F;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8B5E3C;
            box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.1);
        }

        .form-group input::placeholder {
            color: #B8A99A;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            width: 100%;
        }

        .btn-primary {
            background: #8B5E3C;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background: #6B4226;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .message {
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.85rem;
        }

        .message.success {
            background: #E8F5E9;
            color: #2E7D32;
            display: block;
            border-left: 3px solid #2E7D32;
        }

        .message.error {
            background: #FFEBEE;
            color: #C62828;
            display: block;
            border-left: 3px solid #C62828;
        }

        .message.warning {
            background: #FFF3E0;
            color: #F57C00;
            display: block;
            border-left: 3px solid #F57C00;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #EDE3D8;
            font-size: 0.85rem;
            color: #7A6B5D;
        }

        .auth-footer a {
            color: #8B5E3C;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 0.8rem 1rem;
                gap: 0.75rem;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
            }

            .nav-links a {
                padding: 0.4rem 0.75rem;
                font-size: 0.8rem;
            }

            .auth-container {
                margin: 1.5rem 1rem;
                padding: 1.5rem;
            }

            .auth-container h1 {
                font-size: 1.3rem;
            }

            .logo-img {
                height: 32px;
            }

            .logo-text {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 1.25rem;
                margin: 1rem 0.75rem;
            }

            .form-group input {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
            }

            .btn {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- НАВИГАЦИЯ КАК НА ГЛАВНОЙ -->
    <nav class="navbar">
        <a href="/" class="logo-link">
            <img src="/static/Logo.svg" alt="SurveySystem Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SurveySystem</span>
        </a>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/login_page">Вход</a>
            <a href="/register_page" class="active">Регистрация</a>
        </div>
    </nav>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <div class="auth-container">
        <h1>Регистрация</h1>

        <form id="register-form" onsubmit="register(event)">
            <div class="form-group">
                <label for="username">Логин *</label>
                <input type="text" id="username" required placeholder="Придумайте логин">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="full-name">ФИО</label>
                <input type="text" id="full-name" placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" required placeholder="Минимум 6 символов" minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm-password">Подтвердите пароль *</label>
                <input type="password" id="confirm-password" required placeholder="Повторите пароль">
            </div>

            <div id="message" class="message"></div>

            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="/login_page">Войти</a>
        </div>
    </div>

    <script>
        // Получаем параметры из URL
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                redirect: params.get('redirect'),
                code: params.get('code')
            };
        }

        async function register(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const fullName = document.getElementById('full-name').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            // Скрываем предыдущее сообщение
            msg.style.display = 'none';
            
            if (!username || !email || !password) {
                msg.className = 'message error';
                msg.textContent = 'Заполните все обязательные поля';
                msg.style.display = 'block';
                return;
            }
            
            if (password !== confirm) {
                msg.className = 'message error';
                msg.textContent = 'Пароли не совпадают';
                msg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                msg.className = 'message error';
                msg.textContent = 'Пароль должен быть минимум 6 символов';
                msg.style.display = 'block';
                return;
            }

            // Определяем URL для перенаправления после регистрации
            const params = getQueryParams();
            let redirectUrl = '/';
            if (params.redirect && params.code) {
                redirectUrl = `/${params.redirect}?code=${params.code}`;
            }

            try {
                const registerResponse = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        full_name: fullName,
                        password: password,
                        role: 'student',
                        redirect_url: redirectUrl
                    })
                });

                const registerData = await registerResponse.json();
                
                if (!registerData.success) {
                    msg.className = 'message error';
                    msg.textContent = registerData.error || 'Ошибка регистрации';
                    msg.style.display = 'block';
                    return;
                }

                msg.className = 'message success';
                msg.textContent = 'Регистрация успешна! Перенаправление...';
                msg.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = registerData.redirect_url || '/';
                }, 1000);

            } catch (error) {
                msg.className = 'message error';
                msg.textContent = 'Ошибка подключения к серверу';
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
