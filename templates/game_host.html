<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление игрой - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .player-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 1rem;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .player-card.answered {
            background: var(--success-light);
            border-color: var(--success);
        }
        .stats-panel {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .stats-panel h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .question-area {
            background: var(--primary-soft);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .timer-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .result-item {
            background: white;
            border-radius: var(--radius-sm);
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item.correct {
            background: var(--success-light);
            border-left: 3px solid var(--success);
        }
        .result-item.wrong {
            background: var(--error-light);
            border-left: 3px solid var(--error);
        }
        .final-result {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .final-result.top {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
        }
        .waiting-players {
            text-align: center;
            padding: 2rem;
            background: var(--primary-soft);
            border-radius: var(--radius-lg);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎮 SurveySystem Game</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="#" onclick="logout()">Выход</a>
        </div>
    </nav>

    <div class="card" id="main-container">
        <div id="setup-screen">
            <div class="admin-header">
                <h1>🎮 Управление игрой</h1>
                <p>Код игры: <strong id="game-code-display"></strong></p>
            </div>
            
            <div id="players-list" class="players-grid"></div>
            
            <div id="game-controls" style="text-align: center;">
                <button id="start-game-btn" class="btn btn-primary" onclick="startGame()" style="font-size: 1.2rem; padding: 1rem 2rem;">
                    🚀 Начать игру
                </button>
                <p style="margin-top: 1rem; color: var(--text-muted);">
                    Попросите учеников отсканировать QR-код и присоединиться к игре
                </p>
            </div>
        </div>

        <div id="game-screen" style="display: none;">
            <div class="stats-panel">
                <div>Вопрос <span id="current-question-num">1</span> / <span id="total-questions">0</span></div>
                <div class="timer-circle" id="timer-display">0</div>
            </div>
            
            <div class="question-area">
                <div class="question-text" id="question-text">Загрузка...</div>
                <div id="question-options" class="options-group"></div>
            </div>
            
            <div id="question-results" style="display: none;">
                <h3>📊 Результаты вопроса</h3>
                <div id="results-stats"></div>
                <div id="players-answers"></div>
            </div>
        </div>

        <div id="final-screen" style="display: none;">
            <div class="admin-header">
                <h1>🏆 Игра завершена!</h1>
            </div>
            <div id="final-results"></div>
            <div style="text-align: center; margin-top: 2rem;">
                <a href="/student_dashboard" class="btn btn-primary">📊 К результатам</a>
                <button onclick="location.reload()" class="btn btn-secondary">🔄 Новая игра</button>
            </div>
        </div>
    </div>

    <script>
        const code = window.location.pathname.split('/').pop();
        let socket = null;
        let currentTest = null;
        let questions = [];
        let currentQuestionIndex = -1;
        let timePerQuestion = 10;
        let isGameActive = false;

        document.getElementById('game-code-display').innerText = code;

        // Подключение WebSocket
        socket = io();

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('join_game_host', {
                game_code: code,
                time_per_question: timePerQuestion,
                total_questions: questions.length
            });
        });

        socket.on('players_update', (data) => {
            updatePlayersList(data.players);
        });

        socket.on('player_joined', (data) => {
            showToast(`🎉 ${data.username} присоединился! (${data.count} игроков)`);
        });

        socket.on('player_left', (data) => {
            showToast(`👋 Игрок покинул игру`);
            loadTestData();
        });

        socket.on('game_started', (data) => {
            isGameActive = true;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('final-screen').style.display = 'none';
            document.getElementById('total-questions').innerText = data.total_questions;
            showToast('🎮 Игра началась! Готовьтесь к первому вопросу!');
        });

        socket.on('question_start', (data) => {
            currentQuestionIndex = data.question_index;
            displayQuestion(data.question, data.time_left);
            startTimer(data.time_left);
            
            document.getElementById('question-results').style.display = 'none';
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
        });

        socket.on('time_up', () => {
            showToast('⏰ Время вышло!');
        });

        socket.on('question_results', (data) => {
            displayQuestionResults(data);
        });

        socket.on('game_ended', (data) => {
            displayFinalResults(data.results);
            isGameActive = false;
        });

        async function loadTestData() {
            try {
                const response = await fetch('/api/get_test_by_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await response.json();
                
                if (data.success) {
                    currentTest = data.test;
                    questions = currentTest.questions;
                    timePerQuestion = currentTest.time_per_question || 10;
                    
                    updatePlayersList([]);
                }
            } catch (error) {
                console.error('Error loading test:', error);
            }
        }

        function updatePlayersList(players) {
            const container = document.getElementById('players-list');
            if (players.length === 0) {
                container.innerHTML = '<div class="waiting-players">⏳ Ожидание подключения игроков...<br><small>Попросите учеников отсканировать QR-код</small></div>';
                return;
            }
            
            container.innerHTML = players.map(p => `
                <div class="player-card">
                    <div>👨‍🎓 ${escapeHtml(p.username)}</div>
                </div>
            `).join('');
        }

        function displayQuestion(question, timeLeft) {
            document.getElementById('question-text').innerHTML = escapeHtml(question.text);
            
            const optionsContainer = document.getElementById('question-options');
            if (question.type === 'choice' || question.type === 'checkbox') {
                optionsContainer.innerHTML = question.options.map(opt => `
                    <label class="option-radio">
                        <input type="${question.type === 'choice' ? 'radio' : 'checkbox'}" name="question" value="${escapeHtml(opt)}" disabled>
                        <span>${escapeHtml(opt)}</span>
                    </label>
                `).join('');
            } else {
                optionsContainer.innerHTML = `<textarea class="text-answer" placeholder="Текстовый ответ..." disabled></textarea>`;
            }
        }

        function startTimer(seconds) {
            let timeLeft = seconds;
            const timerEl = document.getElementById('timer-display');
            
            const interval = setInterval(() => {
                if (!isGameActive) {
                    clearInterval(interval);
                    return;
                }
                timerEl.innerText = timeLeft;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(interval);
                }
            }, 1000);
        }

        function displayQuestionResults(data) {
            document.getElementById('question-results').style.display = 'block';
            document.getElementById('results-stats').innerHTML = `
                <div style="text-align: center; padding: 1rem;">
                    <div style="font-size: 2rem;">${data.correct_count} / ${data.total_players}</div>
                    <div>учеников ответили правильно</div>
                    <div style="font-size: 0.9rem; margin-top: 0.5rem;">(${data.percentage}%)</div>
                </div>
            `;
        }

        function displayFinalResults(results) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
            
            const container = document.getElementById('final-results');
            container.innerHTML = results.map((r, idx) => `
                <div class="final-result ${idx === 0 ? 'top' : ''}">
                    <div>
                        <strong>${idx + 1}. ${escapeHtml(r.username)}</strong>
                        <div style="font-size: 0.8rem;">✅ ${r.correct_answers} правильных ответов</div>
                    </div>
                    <div style="font-size: 1.5rem; font-weight: 700;">${r.score} / ${r.total_possible}</div>
                </div>
            `).join('');
        }

        function startGame() {
            if (questions.length === 0) {
                alert('Загрузка теста... Попробуйте еще раз');
                loadTestData();
                setTimeout(() => startGame(), 1000);
                return;
            }
            
            socket.emit('start_game', {
                game_code: code,
                questions: questions,
                time_per_question: timePerQuestion
            });
            
            document.getElementById('start-game-btn').disabled = true;
            document.getElementById('start-game-btn').innerText = '⏳ Игра началась...';
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: var(--primary);
                color: white;
                padding: 0.75rem 1.5rem;
                border-radius: 9999px;
                z-index: 1000;
                animation: fadeIn 0.3s ease;
            `;
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function logout() {
            await fetch('/logout');
            window.location.href = '/';
        }

        loadTestData();
    </script>
</body>
</html>
