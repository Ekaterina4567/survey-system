<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 2.5rem auto;
            padding: 2rem 2.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-md);
        }
        
        .auth-container h1 {
            font-size: 1.6rem;
            margin-bottom: 1.25rem;
            text-align: center;
            font-weight: 700;
        }
        
        .auth-container .form-group {
            margin-bottom: 1rem;
        }
        
        .auth-container .form-group label {
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .auth-container .form-group input {
            padding: 0.6rem 0.9rem;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
        }
        
        .auth-container .btn {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }
        
        .auth-footer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            font-size: 0.85rem;
        }
        
        .auth-footer p {
            margin: 0.3rem 0;
        }
        
        .auth-footer .admin-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        
        .message {
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }
        
        .navbar {
            padding: 0.8rem 2.5rem;
        }
        
        .logo-img {
            height: 38px;
        }
        
        .logo-text {
            font-size: 1.3rem;
        }
        
        .nav-links a {
            padding: 0.45rem 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-link">
            <img src="/static/Logo.svg" alt="SurveySystem Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SurveySystem</span>
        </a>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/login_page" class="active">Вход</a>
            <a href="/register_page">Регистрация</a>
        </div>
    </nav>

    <div class="auth-container">
        <h1>Вход в систему</h1>
        
        <form id="login-form" onsubmit="login(event)">
            <div class="form-group">
                <label for="username">Логин или Email</label>
                <input type="text" id="username" required placeholder="Введите логин или email">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required placeholder="Введите пароль">
            </div>
            
            <div id="message" class="message"></div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>
        
        <div class="auth-footer">
            <p>Нет аккаунта? <a href="/register_page">Зарегистрироваться</a></p>
            <p class="admin-hint"></p>
        </div>
    </div>

    <script>
        // Получаем параметры из URL
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                redirect: params.get('redirect'),
                code: params.get('code')
            };
        }

        async function login(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                msgDiv.className = 'message error';
                msgDiv.textContent = 'Заполните все поля';
                msgDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = data.message;
                    msgDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = data.redirect || '/';
                    }, 1000);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = data.error || 'Ошибка входа';
                    msgDiv.style.display = 'block';
                }
            } catch (error) {
                msgDiv.className = 'message error';
                msgDiv.textContent = 'Ошибка подключения к серверу';
                msgDiv.style.display = 'block';
            }
        }

        // Если есть параметры в URL, показываем сообщение
        const params = getQueryParams();
        if (params.redirect && params.code) {
            const msgDiv = document.getElementById('message');
            msgDiv.className = 'message warning';
            msgDiv.textContent = 'Для прохождения теста необходимо войти в систему';
            msgDiv.style.display = 'block';
        }
    </script>
</body>
</html>
