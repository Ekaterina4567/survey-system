<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прохождение теста - SurveySystem</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .option-radio, .option-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 10px;
            transition: background 0.2s;
        }
        .option-radio:hover, .option-checkbox:hover {
            background: #F5EDE3;
        }
        .text-answer {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #EDE3D8;
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
        }
        .logo-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-link:hover {
            opacity: 0.85;
        }
        .logo-img {
            height: 38px;
            width: auto;
            display: block;
            object-fit: contain;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .search-container .illustration {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .survey-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .btn-primary, .btn-secondary, .submit-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--text-light);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .btn-secondary {
            background: var(--secondary);
            color: var(--text-light);
        }
        .btn-secondary:hover {
            background: #1E4A6E;
        }
        .submit-btn {
            background: var(--success);
            color: white;
        }
        .submit-btn:hover {
            background: #1B5E20;
        }
        .success-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .score-display {
            background: var(--success-light);
            color: var(--success);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin: 1.5rem 0;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .step {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .search-container {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            border: 1px solid var(--border-card);
            text-align: center;
            box-shadow: var(--shadow-md);
        }
        .search-container h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .search-container p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .code-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .code-form .form-group {
            margin-bottom: 0;
        }
        .code-form .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.85rem;
        }
        .code-form .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: inherit;
            background: var(--bg-white);
        }
        .code-form .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.1);
        }
        .survey-actions {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 2rem;
        }
        .survey-actions button {
            flex: 1;
        }
        .success-container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 3rem;
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-card);
            text-align: center;
            box-shadow: var(--shadow-lg);
        }
        .success-container h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .question-item {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-card);
        }
        .question-text {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .progress-bar {
            background: var(--border-light);
            height: 8px;
            border-radius: var(--radius-full);
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: var(--radius-full);
        }
        .message {
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            display: none;
            font-size: 0.85rem;
        }
        .message.success {
            background: var(--success-light);
            color: var(--success);
            display: block;
            border-left: 3px solid var(--success);
        }
        .message.error {
            background: var(--error-light);
            color: var(--error);
            display: block;
            border-left: 3px solid var(--error);
        }
        .message.warning {
            background: var(--warning-light);
            color: var(--warning);
            display: block;
            border-left: 3px solid var(--warning);
        }
        .survey-header {
            background: var(--primary-soft);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-white);
            padding: 0.8rem 2.5rem;
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .nav-links {
            display: flex;
            gap: 1rem;
        }
        .nav-links a {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-radius: var(--radius-sm);
        }
        .nav-links a:hover {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .nav-links a.active {
            color: var(--primary);
            background: var(--primary-soft);
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 0.8rem 1rem;
                gap: 0.75rem;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            .survey-actions {
                flex-direction: column;
            }
            .survey-actions button {
                width: 100%;
            }
            .search-container {
                padding: 1.5rem;
            }
            .search-container h1 {
                font-size: 1.5rem;
            }
            .success-container {
                padding: 1.5rem;
                margin: 1rem;
            }
            .step {
                padding: 0 0.75rem;
            }
        }
        @media (max-width: 480px) {
            .logo-img {
                height: 32px;
            }
            .logo-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo-link">
            <img src="/static/Logo.svg" alt="SurveySystem Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">SurveySystem</span>
        </a>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/student_dashboard">Мои результаты</a>
            <a href="/take_test" class="active">Пройти тест</a>
            <a href="/create_test_page">Создать тест</a>
            <a href="#" onclick="logout()">Выход</a>
        </div>
    </nav>

    <div id="code-step" class="step active">
        <div class="search-container">
            <div class="illustration">📋</div>
            <h1>Прохождение теста</h1>
            <p>Введите код теста, чтобы начать</p>
            
            <div class="code-form">
                <div class="form-group">
                    <label for="test-code">Код теста:</label>
                    <input type="text" id="test-code" placeholder="Например: ABC123" required>
                </div>
                <button class="btn btn-primary" onclick="findTest()">Найти тест</button>
            </div>
        </div>
    </div>

    <div id="test-step" class="step" style="display: none;">
        <div class="survey-header">
            <h2 id="display-test-title">Название теста</h2>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="questions-container"></div>

        <div class="survey-actions">
            <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" style="display: none;">Назад</button>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Далее</button>
            <button class="btn btn-primary submit-btn" id="submit-btn" onclick="submitTest()" style="display: none;">Завершить тест</button>
        </div>
    </div>

    <div id="result-step" class="step" style="display: none;">
        <div class="success-container">
            <div class="success-icon">🎉</div>
            <h2>Тест завершен!</h2>
            <div id="score-display"></div>
            <div style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="/student_dashboard" class="btn btn-primary">Мои результаты</a>
                <a href="/take_test" class="btn btn-secondary">Другой тест</a>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script>
        let currentTest = null;
        let currentQuestionIndex = 0;
        let userAnswers = {};

        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');
        if (codeFromUrl) {
            document.getElementById('test-code').value = codeFromUrl;
            findTest();
        }

        async function findTest() {
            const code = document.getElementById('test-code').value.trim();
            if (!code) {
                showMessage('Введите код теста', 'warning');
                return;
            }

            try {
                const response = await fetch('/api/get_test_by_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showMessage(data.error, 'error');
                    return;
                }
                
                currentTest = data.test;
                document.getElementById('display-test-title').textContent = currentTest.title;
                
                document.getElementById('code-step').style.display = 'none';
                document.getElementById('test-step').style.display = 'block';
                
                loadQuestions();
                showMessage('Тест найден! Удачи!', 'success');
                
            } catch (error) {
                showMessage('Ошибка при поиске теста', 'error');
            }
        }

        function loadQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            currentTest.questions.forEach((question, idx) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item fade-in';
                questionDiv.id = `question-${idx}`;
                questionDiv.style.display = idx === 0 ? 'block' : 'none';
                
                questionDiv.innerHTML = `
                    <div class="question-text">
                        <span style="background: #F5EDE3; padding: 0.2rem 0.5rem; border-radius: 20px; font-size: 0.7rem; margin-right: 0.5rem;">
                            ${question.points || 1} балл${(question.points || 1) > 1 ? 'а' : ''}
                        </span>
                        ${escapeHtml(question.question_text)}
                    </div>
                    <div class="options-group" id="options-${idx}">
                        ${renderQuestionOptions(question, idx)}
                    </div>
                `;
                
                container.appendChild(questionDiv);
            });
            
            updateProgress();
            updateButtons();
        }

        function renderQuestionOptions(question, idx) {
            if (question.question_type === 'text') {
                return `<textarea class="text-answer" id="answer-${idx}" rows="3" placeholder="Введите ваш ответ..."></textarea>`;
            }
            
            if (question.question_type === 'choice') {
                let html = '<div style="display: flex; flex-direction: column; gap: 0.5rem;">';
                question.options.forEach(opt => {
                    html += `
                        <label class="option-radio">
                            <input type="radio" name="question-${idx}" value="${escapeHtml(opt)}">
                            <span>${escapeHtml(opt)}</span>
                        </label>
                    `;
                });
                html += '</div>';
                return html;
            }
            
            if (question.question_type === 'checkbox') {
                let html = '<div style="display: flex; flex-direction: column; gap: 0.5rem;">';
                question.options.forEach(opt => {
                    html += `
                        <label class="option-checkbox">
                            <input type="checkbox" name="question-${idx}" value="${escapeHtml(opt)}">
                            <span>${escapeHtml(opt)}</span>
                        </label>
                    `;
                });
                html += '</div>';
                return html;
            }
            
            return '';
        }

        function saveCurrentAnswer() {
            const currentQ = currentTest.questions[currentQuestionIndex];
            let answer = null;
            
            if (currentQ.question_type === 'text') {
                const textarea = document.getElementById(`answer-${currentQuestionIndex}`);
                if (textarea) answer = textarea.value;
            } 
            else if (currentQ.question_type === 'choice') {
                const selected = document.querySelector(`input[name="question-${currentQuestionIndex}"]:checked`);
                if (selected) answer = selected.value;
            } 
            else if (currentQ.question_type === 'checkbox') {
                const selected = document.querySelectorAll(`input[name="question-${currentQuestionIndex}"]:checked`);
                if (selected.length > 0) {
                    answer = Array.from(selected).map(cb => cb.value).join(',');
                }
            }
            
            if (answer !== null && answer !== '') {
                userAnswers[currentTest.questions[currentQuestionIndex].id] = answer;
            }
        }

        function nextQuestion() {
            saveCurrentAnswer();
            
            if (currentQuestionIndex < currentTest.questions.length - 1) {
                document.getElementById(`question-${currentQuestionIndex}`).style.display = 'none';
                currentQuestionIndex++;
                document.getElementById(`question-${currentQuestionIndex}`).style.display = 'block';
                updateProgress();
                updateButtons();
            }
        }

        function prevQuestion() {
            saveCurrentAnswer();
            
            if (currentQuestionIndex > 0) {
                document.getElementById(`question-${currentQuestionIndex}`).style.display = 'none';
                currentQuestionIndex--;
                document.getElementById(`question-${currentQuestionIndex}`).style.display = 'block';
                updateProgress();
                updateButtons();
            }
        }

        function updateProgress() {
            const total = currentTest.questions.length;
            const answered = Object.keys(userAnswers).length;
            const percent = (answered / total) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');
            
            prevBtn.style.display = currentQuestionIndex === 0 ? 'none' : 'flex';
            
            if (currentQuestionIndex === currentTest.questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'flex';
            } else {
                nextBtn.style.display = 'flex';
                submitBtn.style.display = 'none';
            }
        }

        async function submitTest() {
            saveCurrentAnswer();
            
            for (let i = 0; i < currentTest.questions.length; i++) {
                const q = currentTest.questions[i];
                if (!userAnswers[q.id]) {
                    showMessage(`Пожалуйста, ответьте на вопрос ${i + 1}`, 'warning');
                    document.getElementById(`question-${currentQuestionIndex}`).style.display = 'none';
                    currentQuestionIndex = i;
                    document.getElementById(`question-${currentQuestionIndex}`).style.display = 'block';
                    updateButtons();
                    return;
                }
            }
            
            try {
                const response = await fetch('/api/submit_test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        test_id: currentTest.id,
                        answers: userAnswers
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('test-step').style.display = 'none';
                    document.getElementById('result-step').style.display = 'block';
                    
                    let message = result.percentage >= 80 ? 'Отлично!' : 
                                 (result.percentage >= 60 ? 'Хорошо!' : 'Попробуйте еще раз!');
                    
                    document.getElementById('score-display').innerHTML = `
                        <div class="score-display">
                            Результат: ${result.score} / ${result.max_score}
                            <div style="font-size: 1.2rem;">(${result.percentage}%)</div>
                        </div>
                        <div style="margin-top: 1rem;">${message}</div>
                    `;
                } else {
                    showMessage(result.error, 'error');
                }
            } catch (error) {
                showMessage('Ошибка при отправке', 'error');
            }
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function logout() {
            await fetch('/logout');
            window.location.href = '/';
        }
    </script>
</body>
</html>
