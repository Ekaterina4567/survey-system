services:
  - type: web
    name: survey-system
    runtime: python
    repo: https://github.com/Ekaterina4567/survey-system
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class eventlet --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
